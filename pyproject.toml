[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Constrained decoding for function calling with a small LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    # llm_sdk se instala desde su carpeta local (ver [tool.uv.sources] abajo).
    # torch / transformers / huggingface-hub llegan transitivamente desde él,
    # así que no hace falta listarlos aquí.
    "llm-sdk",
]

[dependency-groups]
# `uv sync` instala este grupo por defecto.
dev = [
    "flake8>=7.0",
    "mypy>=1.9",
    "pytest>=8.0",
]

[tool.uv]
# Nuestro proyecto es una aplicación, no una librería: uv no lo empaqueta.
package = false

[tool.uv.sources]
# Instala el paquete llm_sdk desde su carpeta (que trae su propio pyproject.toml
# con build backend). Ajusta la ruta si la carpeta no está en la raíz del repo.
llm-sdk = { path = "llm_sdk" }

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
# No descubrir ni chequear el cuerpo de llm_sdk (código de terceros).
exclude = ['(^|/)(\.venv|build|dist|llm_sdk)(/|$)']

# Al importarlo desde src, tratar llm_sdk como módulo opaco: mypy no mira su
# interior ni se queja de sus atributos. Cubre el paquete raíz Y los submódulos.
[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
follow_imports = "skip"
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
