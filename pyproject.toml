[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Constrained decoding for function calling with a small LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    # llm_sdk is installed from its local folder (see [tool.uv.sources] below).
    # torch / transformers / huggingface-hub come in transitively from it,
    # so there is no need to list them here.
    "llm-sdk",
]

[dependency-groups]
# `uv sync` installs this group by default.
dev = [
    "flake8>=7.0",
    "mypy>=1.9",
    "pytest>=8.0",
]

[tool.uv]
# Our project is an application, not a library: uv does not package it.
package = false

[tool.uv.sources]
# Install the llm_sdk package from its folder (which ships its own
# pyproject.toml with a build backend). Adjust the path if the folder is not
# at the repository root.
llm-sdk = { path = "llm_sdk" }

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
# Do not discover or check the body of llm_sdk (third-party code).
exclude = ['(^|/)(\.venv|build|dist|llm_sdk)(/|$)']

# When imported from src, treat llm_sdk as an opaque module: mypy neither looks
# inside it nor complains about its attributes. Covers the root package AND the
# submodules.
[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
follow_imports = "skip"
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
